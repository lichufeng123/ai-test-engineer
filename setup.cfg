[metadata]
name = ai-test-engineer
version = 0.13.0a2
description = Portable orchestration and quality gates for AI-assisted software testing
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.package_data]
ai_test_framework.starter_playwright = .gitignore, README.md, package.json, package-lock.json, playwright.config.ts, pages/*.ts, flows/*.ts, oracles/*.ts, evidence/*.ts, tests/*.ts

[options.entry_points]
console_scripts =
    ai-test = ai_test_framework.cli:main
