[metadata]
name = ai-test-engineer
version = 0.4.0
description = Portable orchestration and quality gates for AI-assisted software testing
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    ai-test = ai_test_framework.cli:main
